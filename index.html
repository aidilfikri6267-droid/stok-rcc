<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <!-- Tag Penting Untuk Responsif Telefon -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Stok Dapur</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 10px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            text-align: center;
            color: #2c3e50;
        }

        /* Navigasi Tab Mesra Telefon */
        .tab-menu {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ddd;
            overflow-x: auto; /* Boleh skrol tepi jika skrin terlalu kecil */
            white-space: nowrap;
        }

        .tab-btn {
            padding: 10px 15px;
            border: none;
            background: #e9ecef;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            font-weight: bold;
            font-size: 0.9rem;
            flex: 1;
            text-align: center;
        }

        .tab-btn.active {
            background: #27ae60;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Form Layout */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        button.btn-primary {
            background-color: #27ae60;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button.btn-primary:hover {
            background-color: #219150;
        }

        /* Bekas Jadual (Elak Terpotong di Telefon) */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px; /* Memastikan jadual tidak terlalu rapik */
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px 10px;
            text-align: left;
            font-size: 0.85rem;
        }

        th {
            background-color: #34495e;
            color: white;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            color: white;
        }

        .badge-low { background-color: #e74c3c; }
        .badge-ok { background-color: #2ecc71; }

        /* Penyesuaian Telefon */
        @media (max-width: 600px) {
            body { padding: 5px; }
            .container { padding: 10px; }
            h1 { font-size: 1.2rem; }
            .tab-btn { font-size: 0.8rem; padding: 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Pengurusan Stok Dapur</h1>

    <!-- Navigasi 3 Tab Sahaja -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab(event, 'tab1')">1. Senarai Stok</button>
        <button class="tab-btn" onclick="openTab(event, 'tab2')">2. Stok Masuk</button>
        <button class="tab-btn" onclick="openTab(event, 'tab3')">3. Rekod Keluar</button>
    </div>

    <!-- TAB 1: SENARAI STOK -->
    <div id="tab1" class="tab-content active">
        <h3>Baki Stok Semasa</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Kuantiti</th>
                        <th>Unit</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="stockTableBody">
                    <!-- Data dimasukkan guna JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- TAB 2: STOK MASUK -->
    <div id="tab2" class="tab-content">
        <h3>Daftar / Tambah Stok Masuk</h3>
        <form id="addStockForm">
            <div class="form-group">
                <label>Nama Item</label>
                <input type="text" id="itemName" placeholder="Contoh: Beras, Minyak Masak" required>
            </div>
            <div class="form-group">
                <label>Kuantiti Masuk</label>
                <input type="number" id="itemQty" step="0.1" min="0" placeholder="0" required>
            </div>
            <div class="form-group">
                <label>Unit</label>
                <select id="itemUnit">
                    <option value="KG">KG</option>
                    <option value="Pek">Pek</option>
                    <option value="Botol">Botol</option>
                    <option value="Karton">Karton</option>
                    <option value="Biji">Biji</option>
                </select>
            </div>
            <button type="submit" class="btn-primary">Simpan Stok Masuk</button>
        </form>
    </div>

    <!-- TAB 3: REKOD KELUAR -->
    <div id="tab3" class="tab-content">
        <h3>Rekod Penggunaan Dapur</h3>
        <form id="useStockForm">
            <div class="form-group">
                <label>Pilih Item</label>
                <select id="useItemSelect" required></select>
            </div>
            <div class="form-group">
                <label>Kuantiti Digunakan</label>
                <input type="number" id="useQty" step="0.1" min="0" placeholder="0" required>
            </div>
            <button type="submit" class="btn-primary" style="background-color: #e67e22;">Rekod Keluar</button>
        </form>
    </div>
</div>

<script>
    // Inisialisasi Data dari LocalStorage
    let inventory = JSON.parse(localStorage.getItem('dapur_inventory')) || [
        { name: 'Beras 10kg', qty: 5, unit: 'Pek', min: 2 },
        { name: 'Minyak Masak 5kg', qty: 1, unit: 'Botol', min: 2 }
    ];

    function saveData() {
        localStorage.setItem('dapur_inventory', JSON.stringify(inventory));
        render();
    }

    function openTab(evt, tabId) {
        let contents = document.getElementsByClassName("tab-content");
        for (let i = 0; i < contents.length; i++) {
            contents[i].classList.remove("active");
        }
        let buttons = document.getElementsByClassName("tab-btn");
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        document.getElementById(tabId).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    function render() {
        // Render Tabel Stok
        const tbody = document.getElementById('stockTableBody');
        tbody.innerHTML = '';
        
        // Render Dropdown Rekod Keluar
        const select = document.getElementById('useItemSelect');
        select.innerHTML = '<option value="">-- Pilih Item --</option>';

        inventory.forEach((item, index) => {
            // Status Rendah
            const isLow = item.qty <= (item.min || 2);
            const badgeClass = isLow ? 'badge-low' : 'badge-ok';
            const badgeText = isLow ? 'Kritikal' : 'Mencukupi';

            tbody.innerHTML += `
                <tr>
                    <td><strong>${item.name}</strong></td>
                    <td>${item.qty}</td>
                    <td>${item.unit}</td>
                    <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                </tr>
            `;

            select.innerHTML += `<option value="${index}">${item.name} (Baki: ${item.qty} ${item.unit})</option>`;
        });
    }

    // Event Listener Tambah Stok
    document.getElementById('addStockForm').addEventListener('submit', function(e) {
        e.value = e.preventDefault();
        const name = document.getElementById('itemName').value.trim();
        const qty = parseFloat(document.getElementById('itemQty').value);
        const unit = document.getElementById('itemUnit').value;

        let existing = inventory.find(i => i.name.toLowerCase() === name.toLowerCase());
        if (existing) {
            existing.qty += qty;
        } else {
            inventory.push({ name, qty, unit, min: 2 });
        }

        saveData();
        this.reset();
        alert('Stok berjaya dikemas kini!');
    });

    // Event Listener Stok Keluar
    document.getElementById('useStockForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const index = document.getElementById('useItemSelect').value;
        const qty = parseFloat(document.getElementById('useQty').value);

        if (index === '') return;

        if (inventory[index].qty < qty) {
            alert('Kuantiti dipinta melebihi baki stok semasa!');
            return;
        }

        inventory[index].qty -= qty;
        saveData();
        this.reset();
        alert('Penggunaan stok berjaya direkodkan!');
    });

    // Muat data awal
    render();
</script>

</body>
</html>
